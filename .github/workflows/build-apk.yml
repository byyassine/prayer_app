name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:   # إمكانية التشغيل اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # توليد هيكل مشروع Android الكامل (SDK مثبت مسبقاً على السيرفر)
      - name: Generate Android project
        run: flutter create . --org com.example --project-name prayer_app --platforms android

      # وضع ملفاتنا الخاصة مكان الملفات الافتراضية
      - name: Apply custom files
        run: |
          cp custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/example/prayer_app
          cp custom/BootReceiver.kt android/app/src/main/kotlin/com/example/prayer_app/BootReceiver.kt

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prayer-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
